beershebashire:
    job              : True
    style            : 'match' # style defined based on processing_style:
                                # match  - match what is given in processing_style
                                # funnel - input same as processing style, output to one file
                                # pipe   - input is one file, output is one file
    pre_path         : "${global.global_path}${global.tag}/data/beersheba/"
    post_path        : ''
    fixed:
        rebin_d          : "[16, 16, 4]"
        nhits            : "3"


IC-isaura:
    city             : 'isaura'
    pre_path         : "${global.global_path}/${global.tag}/data/beershebashire/"
    post_path        : ''
    fixed:
        print_mod        : "1"
        detector_db      : "'next100'"
        vox_size         : "[10 * mm, 10 * mm, 10 * mm],"
    

topology:
    job              : True
    style            : 'funnel' # style defined based on processing_style:
                                # match  - match what is given in processing_style
                                # funnel - input same as processing style, output to one file
                                # pipe   - input is one file, output is one file
    pre_path         : "${global.global_path}${global.tag}/data/isaura/"
    post_path        : ''
    fixed:
       z_lower           : 20
       z_upper           : 500
       r_lim             : 350
       e_lower           : 1.4
       e_upper           : 1.8
    mem              : '32G'


move_files_IC:
    job              : False # defines whether or not the job is scheduled or ran on the local machine
    fixed:
        old_path         : '/scratch/halmazan/NEXT/N100_LPR/production_output'
        new_path         : '/data/halmazan/NEXT/N100_LPR/production_output'
        cities           : ['beersheba', 'isaura', 'beershebashire'] # city you're extracting from



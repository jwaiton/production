global:
    tag              : 'kr_202602_fast'
    verbose          : 1
    cluster_sys      : 'SLURM'
    processing_style : 'LDC' # LDC, FOLDER, FILE
    LDCs             : 7
    RUNS             : ['kr_202602']
    flow_priority    : 'RUN'   # either RUN or JOB
    # RUN prio means it will complete all jobs for a run first
    # JOB prio means it will complete the job for all runs first
    #global_path     : '/home/e78368jw/Documents/NEXT_CODE/production/test_data'
    global_path      : '/scratch/halmazan/NEXT/N100_LPR/production_output/'
    # global path is where your data is stored
    max_num_jobs     : 400 
    env_script       : '/scratch/halmazan/NEXT/PROCESSING/production/templates/env_templates/dipc_master.sh'
    MC               : True



IC-sophronia:
    city              : 'sophronia'
    # these are for input, output from the global_path
    pre_path          : '/data/halmazan/NEXT/N100_LPR_MC/' 
    post_path         : 'hypathia/'
    # f'{pre_path}{RUN_NUMBER}/{post_path}'
    fixed:
        #compression      : "'ZLIB4'" # strings need to be referred to as such
        print_mod        : "1"
        detector_db      : "'next100'"
        corrections      : "None"
        event_range      : "all"
        drift_v          : "0.87 * mm / mus" # updated drift velo
        s1_nmax          : "127,"
        s1_emin          : "0.1 * pes,"
        s1_emax          : "1e9 * pes,"
        s1_wmin          : "125 * ns,"
        s1_wmax          : "1000 * ns,"
        s1_hmin          : "0.25 * pes,"
        s1_hmax          : "1e9 * pes,"
        s1_ethr          : "0 * pes,"
        s2_nmin          : "1,"
        s2_nmax          : "50,"
        s2_emin          : "1e3 * pes,"
        s2_emax          :  "1e9 * pes,"
        s2_wmin          :    "2 * mus,"
        s2_wmax          :  "1e4 * mus,"
        s2_hmin          :   "50 * pes,"
        s2_hmax          :  "1e9 * pes,"
        s2_ethr          :    "0 * pes,"
        s2_nsipmmin      :    "1,"
        s2_nsipmmax      : "6000," # no cut
        rebin            : "1000000"
        rebin_method     : "stride"
        global_reco_algo : "corona"
        Qthr             : "4*pes,"
        Qlm              : "20*pes,"
        lm_radius        : "1,"
        new_lm_radius    : "2*np.sqrt(2)*15.55 + 0.1,"
        msipm            : "1,"
        consider_masked  : "False,)"


IC-eutropia:
    city              : 'eutropia'
    # these are for input, output from the global_path
    pre_path          : '${global.global_path}${global.tag}/data/sophronia/' 
    post_path         : ''
    # f'{pre_path}{RUN_NUMBER}/{post_path}'
    fixed:
        detector_db      : "'next100'"
        xrange           : "-100, 100"
        yrange           : "-100, 100"
        zbins            : "[100, 300, 500, 700, 900, 1100, 1300]"
        xsectors         : "-500, 500"
        ysectors         : "-500, 500"       
        bin_size_xy      : "1.0 * mm"

merge_psf:
    job               : True
    style             : 'funnel'
    pre_path          : '${global.global_path}${global.tag}/data/eutropia/'
    post_path         : ''
    mem               : '32G'
